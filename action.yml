name: 'Aikido Code Coverage'
description: 'Collect an LCOV code coverage report and upload it to Aikido.'
author: 'Aikido Security'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  aikido-ci-token:
    description: 'Aikido CI API token. Store it as a repository secret. Mutually exclusive with use-oidc.'
    required: false
  use-oidc:
    description: 'Authenticate keylessly with GitHub OIDC instead of a token. Requires permissions: id-token: write.'
    required: false
    default: 'false'
  lcov-file-paths:
    description: 'Path(s) to the LCOV coverage report(s). Separate multiple entries with newlines'
    required: true
  fail-on-error:
    description: 'Fail the action if discovery or upload fails. Set to false to warn instead.'
    required: false
    default: 'true'

runs:
  using: 'node24'
  main: 'dist/index.js'
