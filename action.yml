name: 'Aikido Code Coverage'
description: 'Collect an LCOV code coverage report and upload it to Aikido.'
author: 'Aikido Security'
branding:
  icon: 'bar-chart-2'
  color: 'purple'

inputs:
  lcov-file-paths:
    description: 'Path(s) to the LCOV coverage report(s). Separate multiple entries with newlines'
    required: true
  fail-on-error:
    description: 'Fail the action if discovery or upload fails. Set to false to warn instead.'
    required: false
    default: 'true'

runs:
  using: 'node24'
  main: 'dist/index.js'
