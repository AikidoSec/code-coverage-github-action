name: 'Aikido Code Coverage'
description: 'Collect LCOV or Cobertura coverage reports and upload them to Aikido.'
author: 'Aikido Security'
branding:
  icon: 'bar-chart-2'
  color: 'purple'

inputs:
  file-paths:
    description: 'Path(s) to the code coverage report(s). Separate multiple entries with newlines. Format is detected from each filename (e.g. lcov.info, *.lcov, *cobertura*.xml).'
    required: true
  region:
    description: 'Aikido region for upload and OIDC audience. One of: eu, us, au, us-gov.'
    required: false
    default: 'eu'
  fail-on-error:
    description: 'Fail the action if discovery or upload fails. Set to false to warn instead.'
    required: false
    default: 'true'
  aikido-token:
    description: 'Static CI Aikido token for authentication. When provided, OIDC authentication cannot be used and needs to be removed from the yaml file.'
    required: false

runs:
  using: 'node24'
  main: 'dist/index.js'
