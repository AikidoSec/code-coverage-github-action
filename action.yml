name: 'Aikido Code Coverage'
description: 'Collect an LCOV or Cobertura code coverage report and upload it to Aikido.'
author: 'Aikido Security'
branding:
  icon: 'bar-chart-2'
  color: 'purple'

inputs:
  file-paths:
    description: 'Path(s) to the code coverage report(s). Separate multiple entries with newlines'
    required: true
  region:
    description: 'Aikido region for upload and OIDC audience. One of: eu, us, au, us-gov.'
    required: false
    default: 'eu'
  fail-on-error:
    description: 'Fail the action if discovery or upload fails. Set to false to warn instead.'
    required: false
    default: 'true'
  format:
    description: 'Format of the coverage report. One of: lcov, cobertura.'
    required: true

runs:
  using: 'node24'
  main: 'dist/index.js'
