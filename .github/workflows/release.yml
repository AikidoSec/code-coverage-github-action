name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ github.ref_name }}
      TAG_SHA: ${{ github.sha }}
    steps:
      - name: Validate release tag
        run: |
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_NAME (expected format: vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Validate tagged commit is on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${TAG_SHA}" --jq '.status')
          case "$status" in
            identical|behind)
              echo "Tag commit ${TAG_SHA} is on main (${status})"
              ;;
            *)
              echo "Tag commit ${TAG_SHA} is not on main (status: ${status})"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      TAG_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify checkout matches validated SHA
        run: |
          head_sha=$(git rev-parse HEAD)
          if [[ "$head_sha" != "$TAG_SHA" ]]; then
            echo "Checkout SHA $head_sha does not match validated TAG_SHA $TAG_SHA"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Commit bundled dist to release tag
        run: |
          head_sha=$(git rev-parse HEAD)
          if [[ "$head_sha" != "$TAG_SHA" ]]; then
            echo "HEAD $head_sha does not match validated TAG_SHA $TAG_SHA"
            exit 1
          fi

          git fetch origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" 2>/dev/null || true
          if git rev-parse "refs/tags/${TAG_NAME}^{commit}" >/dev/null 2>&1; then
            tag_sha=$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")
            if [[ "$tag_sha" != "$TAG_SHA" ]]; then
              echo "Tag $TAG_NAME points to $tag_sha, expected validated $TAG_SHA"
              exit 1
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --staged --quiet; then
            echo "dist/ is already bundled in $TAG_NAME"
            exit 0
          fi
          git commit -m "Build dist for $TAG_NAME"
          git tag -f "$TAG_NAME"
          git push origin "refs/tags/$TAG_NAME" --force

      - name: Create GitHub Release
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists"
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
