name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: standard-runner-no-rights-public-ip
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit bundled dist to release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --staged --quiet; then
            echo "dist/ is already bundled in ${{ github.ref_name }}"
            exit 0
          fi
          git commit -m "Build dist for ${{ github.ref_name }}"
          git tag -f "${{ github.ref_name }}"
          git push origin "refs/tags/${{ github.ref_name }}" --force

      - name: Create GitHub Release
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists"
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
