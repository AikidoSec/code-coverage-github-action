name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: open-source-releaser
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG_NAME (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${{ github.sha }}" --jq .status)
          if [[ "$status" != identical && "$status" != behind ]]; then
            echo "Tag commit is not on main (status: $status)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Bundle dist into release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --staged --quiet; then
            echo "dist/ already bundled in $TAG_NAME"
            exit 0
          fi
          git commit -m "Build dist for $TAG_NAME"
          git tag -f "$TAG_NAME"
          git push origin "refs/tags/$TAG_NAME" --force

      - name: Create GitHub Release
        run: |
          # Dist retags leave previous tags off the main ancestry, so
          # auto-detection fails — pin notes to the previous semver tag.
          previous_tag=$(
            git tag -l 'v*' --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              grep -vx "$TAG_NAME" |
              head -n 1 || true
          )

          args=(--title "$TAG_NAME" --generate-notes)
          [[ -n "$previous_tag" ]] && args+=(--notes-start-tag "$previous_tag")

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists"
          else
            gh release create "$TAG_NAME" "${args[@]}"
          fi
